<ion-header><ion-toolbar><ion-title>Iniciar sesión</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <ion-item><ion-input label="Usuario" labelPlacement="stacked" [(ngModel)]="username"></ion-input></ion-item>
  <ion-item><ion-input label="Contraseña" type="password" labelPlacement="stacked" [(ngModel)]="password"></ion-input></ion-item>
  <ion-button expand="block" (click)="doLogin()" [disabled]="loading">Entrar</ion-button>
</ion-content>
