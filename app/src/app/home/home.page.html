<ion-header>
  <ion-toolbar>
    <ion-title>Esta es la aplicación telemática de Angel Daniel Santamaria</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>App académica en Ionic para registrar, borrar y consultar datos de empleados.</p>
  <ion-button routerLink="/login">Iniciar sesión</ion-button>

  <ion-list class="ion-margin-top">
    <ion-list-header>Registros públicos</ion-list-header>
    <ion-spinner *ngIf="loading"></ion-spinner>
    <ion-item *ngFor="let e of empleados">
      <ion-label>
        <h2>{{ e.first_name }} {{ e.last_name }}</h2>
        <p>#{{ e.emp_no }} — Ingreso: {{ e.hire_date }}</p>
      </ion-label>
    </ion-item>
    <ion-text color="medium" *ngIf="!loading && empleados.length===0">No hay registros.</ion-text>
  </ion-list>
</ion-content>
