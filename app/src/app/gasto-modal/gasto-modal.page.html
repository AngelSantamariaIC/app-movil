<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="cancelar()">Cancelar</ion-button>
    </ion-buttons>
    <ion-title>Registrar Gasto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="guardarMovimiento()" [strong]="true" [disabled]="loading">
        <ion-spinner *ngIf="loading" slot="icon-only" name="dots"></ion-spinner>
        <span *ngIf="!loading">Guardar</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form (ngSubmit)="guardarMovimiento()">
    
    <ion-item fill="outline" class="ion-margin-bottom">
      <ion-label position="floating">Valor del Gasto (ej. 15.50)</ion-label>
      <ion-input
        type="number"
        inputmode="decimal"
        placeholder="0.00"
        [(ngModel)]="movimientos_valor"
        name="valor"
        required>
        <span slot="start">$</span>
      </ion-input>
    </ion-item>

    <ion-item fill="outline" class="ion-margin-bottom">
      <ion-label position="floating">Categoría</ion-label>
      <ion-select
        [(ngModel)]="movimientos_id_categoria"
        name="categoria"
        interface="action-sheet"
        placeholder="Selecciona una categoría"
        required>
        <ion-select-option *ngFor="let cat of categoriasGasto" [value]="cat.categorias_id">
          {{ cat.categorias_descripcion }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item fill="outline" class="ion-margin-bottom">
      <ion-label position="floating">Fecha</ion-label>
      <ion-datetime
        [(ngModel)]="movimientos_fecha"
        name="fecha"
        display-format="DD MMM YYYY"
        picker-format="DD MMM YYYY"
        placeholder="Selecciona una fecha">
      </ion-datetime>
    </ion-item>

  </form>
</ion-content>
